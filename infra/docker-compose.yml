version: "3.9"
services:
  db:
    image: postgres:16
    container_name: jobappledger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobappledger
    ports:
      - "55489:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: